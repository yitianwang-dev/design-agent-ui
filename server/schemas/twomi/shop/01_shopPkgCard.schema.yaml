# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _guidance_to_agent: |
    Card import 後、Recommended badge / SKU (Icon + Information) / PriceSection
    は全部内部 render。spec で「おすすめパック」「ticket icon 左側」「価格
    右側」等が言及されても、card 1 instance を import するだけで全部 visible。
    Recommended badge を OFF にしたい場合のみ Boolean property を false に。
  _recommended_pattern: |
    1) Spec が「500 ticket pack」「5枚パック」を含めば Set=500 を選ぶ。
    2) Recommended ON/OFF は spec の「おすすめ」「Recommended」キーワード or
       「強調表示」指定で決定。デフォルトは true (badge 表示)。
    3) Pressed state は user interaction での tap feedback、static prototype
       では Default のみで十分。
  elements_rendered_internally:
    - "Recommended badge (おすすめ / Recommended + sparkles icon)"
    - "SKU: Icon (Ticker Bold) + Information (SetNameText + DescriptionText)"
    - "PriceSection (Price text ¥N)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  spec_signal_to_variant:
    Language:
      "「日本語」「JP」 or default": JP
      "「English」「EN」": EN
    Set:
      "「500」「1セット」「5枚」「lowest tier」「cheapest」": "500"
      "「1000」「2セット」「10枚」「mid tier」": "1000"
      "「2000」「4セット」「20枚」「highest tier」「premium pack」": "2000"
    Value:
      "「default」「resting」 or default": Default
      "「pressed」「tap feedback」「user is pressing」": Pressed

  spec_signal_to_boolean:
    "Recommended#2037:3":
      "「おすすめ」「recommended」「強調」「badge ON」 or default": true
      "「badge OFF」「no badge」「plain」": false

  default_variant:
    Language: JP
    Set: "500"
    Value: Default

  default_boolean:
    "Recommended#2037:3": true

  common_scenarios:
    "ticket_purchase_screen_3_pack_grid":
      description: |
        Shop / チケット購入画面の標準パターン。3 つの PkgCard を縦に並べる:
        1 つ目 Set=500 (デフォルト Recommended=true → おすすめ badge 表示)
        2 つ目 Set=1000 (Recommended=true)
        3 つ目 Set=2000 (Recommended=true)
        または 1 つだけ "おすすめ" badge を強調する場合: Set=1000 (中段)
        だけ Recommended=true、他は false。
      variants:
        - { Language: JP, Set: "500",  Value: Default }
        - { Language: JP, Set: "1000", Value: Default }
        - { Language: JP, Set: "2000", Value: Default }
    "single_recommended_highlight":
      description: |
        中段だけおすすめ badge を強調表示するパターン (best value 演出)
      variants:
        - { Language: JP, Set: "500",  Value: Default, _boolean: { "Recommended#2037:3": false } }
        - { Language: JP, Set: "1000", Value: Default, _boolean: { "Recommended#2037:3": true  } }
        - { Language: JP, Set: "2000", Value: Default, _boolean: { "Recommended#2037:3": false } }

  selection_examples:
    - spec: "Show 3 ticket packs (500/1000/2000) JP, all with おすすめ badge"
      decisions:
        - { Language: JP, Set: "500",  Value: Default, Recommended: true }
        - { Language: JP, Set: "1000", Value: Default, Recommended: true }
        - { Language: JP, Set: "2000", Value: Default, Recommended: true }
    - spec: "Highlight only the 1000 pack as recommended"
      decisions:
        - { Set: "500",  Recommended: false }
        - { Set: "1000", Recommended: true }
        - { Set: "2000", Recommended: false }

  related_components:
    - "sendTicketTippingBottomSheet (schema 26) NotEnoughTickets state — 購入 CTA から本 card に遷移"
    - "headMenu / closeButton — Shop 画面の Header に置く戻る button"
    - "Dialog/Button item or 確認 CTA — purchase confirmation"

  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('565d4a478945cafc7fdadcd865d4ac90f89806aa');
    const variant = set.children.find(v =>
      v.variantProperties?.Language === 'JP' &&
      v.variantProperties?.Set === '500' &&
      v.variantProperties?.Value === 'Default'
    ) || set.defaultVariant;
    const instance = variant.createInstance();
    // Recommended boolean toggle (default true). Set false to hide badge.
    instance.setProperties({ 'Recommended#2037:3': true });
    instance.x = 16; instance.y = 140;

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: MUST
    rule: |
      Library 注記「インスタンス上での文言変更禁止」— SetNameText / DescriptionText /
      Price / Title (Recommended badge) の文言を override しない。Set / Language
      variant 切替でしか変更不可。
  - severity: SHOULD
    rule: |
      Text node 名が Set 別に番号付き (SetNameText1/2/3, DescriptionText1/2/3,
      Price1/2/3) — findOne で探す時は variant の Set 値依存の suffix に注意。
  - severity: SHOULD
    rule: |
      Pressed variant はサイズが ~3% 縮小 (370→358.9, 104→100.88) で押下
      フィードバック表現。Static prototype では Default のみで十分、Pressed
      は interaction prototype で必要時のみ。
  - severity: NICE
    rule: |
      3 card 縦並びパターンでは padding 12-16px 推奨。Shop 画面 402 width に
      対して card 370 width = 左右 16px margin が標準。
