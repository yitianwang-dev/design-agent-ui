# ============================================================
# Schema PJ — Shop / PkgCard (single-component-set)
# ============================================================
# Generated: 2026-06-04
#
# チケット購入画面のパッケージ選択カード。Set で枚数・金額を切替、
# Value (Default/Pressed) で押下状態、Recommended (Boolean) で「おすすめ」
# バッジ表示を制御。12 variants × Recommended boolean = 24 effective states。
#
# Usage flow: viewer がチケット不足で SendTicketTippingBottomSheet の
# 「購入する」CTA タップ → Shop / チケット購入画面に遷移 → 本 card を縦に
# 3 つ並べて (500 / 1000 / 2000) 選択させる。Set 別に 1セット (5枚) /
# 2セット (10枚) / 4セット (20枚) と段階的にお得になる。
#
# Runtime requirements: v0.5+ with variants.combinations + by_variant
# ============================================================

meta:
  name: Shop/PkgCard
  library_source:
    file_key: CPe64VQc7petbZawTE6J8o
    component_set_node_id: "565d4a478945cafc7fdadcd865d4ac90f89806aa"
  library_description_raw: |
    【用途 / Usage】
    チケット購入画面のパッケージ選択カード。Setで枚数・金額を切り替える。
    Package selection card on ticket purchase screen.
    【使用画面 / Used in】
    Shop / チケット購入画面 / Ticket purchase screen
    【State】
    Set: 500 / 1000 / 2000｜Value: Default / Pressed｜Recommended: Boolean｜Language: JP / EN
    【注意 / Notes】
    インスタンス上での文言変更禁止。Do not edit text on instances.
  description: |
    1 行 1 パッケージ card (370×104 Default / ~358.9×100.88 Pressed)。
    左に Ticker icon、中央に SetName + Description、右に Price、上部右に
    Recommended badge (「おすすめ」/ "Recommended")。Set 別に内部 text node
    が SetNameText1/2/3 と Price1/2/3 と異なるため、外部から findOne で
    探す場合は Set 値依存の番号サフィックスに注意。
  screen_usage:
    - "チケット購入画面 / Shop ticket purchase screen — 3 card 縦並び (500 / 1000 / 2000)"
    - "「チケットが足りません」 alert からの遷移先 — SendTicketTippingBottomSheet (schema 26) NotEnoughTickets state からの purchase CTA"
  dependencies:
    - "Ticker Bold (内部 icon instance — ticket 図形 32×32 vector)"
    - "Recommended badge (内部 instance — sparkles_rectangle_stack + おすすめ text)"
  runtime_version: v0.5
  coverage:
    total_variants:
      "Shop/PkgCard": 12
    implemented: full
    notes: |
      12 variants = Language (JP/EN) × Set (500/1000/2000) × Value (Default/Pressed)。
      + Recommended (Boolean property) で badge ON/OFF → 実質 24 表示状態。
      Default 370×104 / Pressed ~358.9×100.88 (~3% shrink で押下フィードバック)。
  review_status: ai-draft

components:
  - id: Shop/PkgCard
    source:
      library_file_key: CPe64VQc7petbZawTE6J8o
      component_set_node_id: "565d4a478945cafc7fdadcd865d4ac90f89806aa"

    variants:
      combinations:
        - { Language: JP, Set: "500",  Value: Default }
        - { Language: JP, Set: "500",  Value: Pressed }
        - { Language: JP, Set: "1000", Value: Default }
        - { Language: JP, Set: "1000", Value: Pressed }
        - { Language: JP, Set: "2000", Value: Default }
        - { Language: JP, Set: "2000", Value: Pressed }
        - { Language: EN, Set: "500",  Value: Default }
        - { Language: EN, Set: "500",  Value: Pressed }
        - { Language: EN, Set: "1000", Value: Default }
        - { Language: EN, Set: "1000", Value: Pressed }
        - { Language: EN, Set: "2000", Value: Default }
        - { Language: EN, Set: "2000", Value: Pressed }

    boolean_properties:
      - { name: "Recommended#2037:3", type: BOOLEAN, default: true }

    container:
