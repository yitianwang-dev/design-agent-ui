# ============================================================
# Schema PJ — ticketSummarySection (single-component-set)
# ============================================================
# Generated: 2026-06-04
#
# チケット購入確認画面のサマリー表示セクション。
# Header sub-block showing user's current ticket balance: "所有チケット 🎫 3枚"
# (JP) / "Ticket owned 🎫 3 tickets" (EN).
#
# Usage flow: PkgCard 選択 → 確認画面に遷移 → 本セクションで「今 N 枚持って
# いる」を表示 → 購入確定 → 残高更新。
#
# Runtime requirements: v0.5+ with variants.combinations
# ============================================================

meta:
  name: ticketSummarySection
  library_source:
    file_key: CPe64VQc7petbZawTE6J8o
    component_set_node_id: "85c3e05e43b3aa16c2ee9bbcea31898823c97a19"
  library_description_raw: |
    【用途 / Usage】
    チケット購入確認画面のサマリー表示セクション。
    Summary section on ticket purchase confirmation screen.
    【使用画面 / Used in】
    チケット購入確認画面 / Ticket purchase confirmation screen
    【State】
    Language: JP / EN
    【注意 / Notes】
    インスタンス上での文言変更禁止。Do not edit text on instances.
  description: |
    402×96 横長 card。左に label「所有チケット」、右に🎫 icon + 枚数。
    Library の defaults は countText="3枚"/"3 tickets" — 実装時は app 側で
    user の実残高を bind し置換する（Figma instance では override 禁止）。
  screen_usage:
    - "チケット購入確認画面 (Ticket purchase confirmation screen) — header 直下の残高表示"
    - "Shop / PkgCard 選択後の確認画面で「今の残高 → 購入後の残高」表示の現在値部分"
  dependencies:
    - "Ticker Bold (内部 icon instance — ticket vector 18×18)"
  runtime_version: v0.5
  coverage:
    total_variants:
      "ticketSummarySection": 2
    implemented: full
    notes: |
      2 variants (Language JP / EN) のみ、両方 402×96 size。
      Boolean / Set property なし、シンプル static component。
  review_status: ai-draft

components:
  - id: ticketSummarySection
    source:
      library_file_key: CPe64VQc7petbZawTE6J8o
      component_set_node_id: "85c3e05e43b3aa16c2ee9bbcea31898823c97a19"

    variants:
      combinations:
        - { Language: JP }
        - { Language: EN }

    container:
      node_type: COMPONENT
      name_template: "Language=${Language}"
      size:
        value: { width: 402, height: 96 }

    children:
      - id: Frame_1
        node_type: FRAME
        name: "Frame 1"
        size: { width: 338, height: 48 }
        position: { x: 32, y: 16 }
        children:
          - id: labelText
            node_type: TEXT
            font_size: 13
            position: { x: 8, y: 17.5 }
            characters:
              by_variant:
                - { when: { Language: JP }, value: "所有チケット" }
                - { when: { Language: EN }, value: "Ticket owned" }

          - id: ticketCount
            node_type: FRAME
            name: ticketCount
            size:
              by_variant:
                - { when: { Language: JP }, value: { width: 50, height: 32 } }
                - { when: { Language: EN }, value: { width: 87, height: 32 } }
            position_by_variant:
              - { when: { Language: JP }, value: { x: 280, y: 8 } }
              - { when: { Language: EN }, value: { x: 243, y: 8 } }
            description: "右端寄せ container — icon + 枚数 text"
            children:
              - id: Icon
                node_type: FRAME
                size: { width: 18, height: 18 }
                position: { x: 0, y: 7 }
                children:
                  - id: Ticker_Bold
                    node_type: INSTANCE
                    name: "Ticker Bold"
                    size: { width: 18, height: 18 }
                    description: "Ticket icon (15×12 vector inside, cyan)"

              - id: countText
                node_type: TEXT
                font_size: 15
                position: { x: 26, y: 8.5 }
                characters:
                  by_variant:
                    - { when: { Language: JP }, value: "3枚" }
                    - { when: { Language: EN }, value: "3 tickets" }
                _note: |
                  Library default = "3枚" / "3 tickets" placeholder。
                  実装時は user の実残高 (state from app) を bind して置換。
                  Figma instance での text override は Library 禁止注記により不可
                  → app 側で componentProperties / variants 等の代替手段か、
                  または instance を detach して app 内で text 制御。

# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _guidance_to_agent: |
    Section import 後、labelText + ticketCount (Icon + countText) は全部内部
    render。spec で「所有チケット表示」「balance display」「ticket icon」等が
    言及されても、本 component 1 instance を import するだけで全部 visible。
  _recommended_pattern: |
    1) Language を spec から決定 (JP / EN)。
    2) createInstance() → position (Header 直下 y=110 推奨、x=0 → 内部 32px
       margin が container に含まれているので外部 margin 不要)。
    3) Count 数字は Library default のまま (prototype 用途では十分)。
       実装時は app 側で dynamic binding。
  elements_rendered_internally:
    - "Frame 1 wrapper"
    - "labelText (所有チケット / Ticket owned)"
    - "ticketCount frame (Icon + countText)"
    - "Icon > Ticker Bold instance (🎫 vector 18×18)"
    - "countText (3枚 / 3 tickets — default placeholder)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  spec_signal_to_variant:
    Language:
      "「日本語」「JP」 or default": JP
      "「English」「EN」": EN

  default_variant:
    Language: JP

  common_scenarios:
    "purchase_confirmation_balance_summary":
      description: |
        チケット購入確認画面の Header 直下に置く現在残高表示
      variant: { Language: JP }
      position: { x: 0, y: 110 }
    "english_purchase_confirmation":
      description: "EN viewer 同"
      variant: { Language: EN }
      position: { x: 0, y: 110 }

  selection_examples:
    - spec: "Show current ticket balance summary at top of purchase confirmation, JP"
      decision: { Language: JP }
    - spec: "Same for EN locale"
      decision: { Language: EN }

  related_components:
    - "Shop/PkgCard (schema 01) — 本セクションの直下に 3 card 並べる"
    - "headMenu / closeButton — 購入確認画面の Header (本セクションの上)"
    - "Dialog/Button item — 購入確定 CTA (本セクションの下)"

  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('85c3e05e43b3aa16c2ee9bbcea31898823c97a19');
    const variant = set.children.find(v => v.variantProperties?.Language === 'JP')
      || set.defaultVariant;
    const instance = variant.createInstance();
    instance.x = 0; instance.y = 110;

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: MUST
    rule: |
      Library 注記「インスタンス上での文言変更禁止」— labelText / countText を
      override しない。Count を dynamic にしたい場合は app 側で binding
      (componentProperties 等)、Figma レベルでは default のまま。
  - severity: SHOULD
    rule: |
      countText の size と position が Language 別 (JP 50×32 @ x=280 vs
      EN 87×32 @ x=243) — EN は "3 tickets" の方が幅広いので右寄せ位置が
      左にシフトしている。Library 自動 handle、外部から override 不要。
  - severity: NICE
    rule: |
      Component は 402×96 だが、Frame 1 (内部 main row) は 338×48 のみ。
      上下 16px / 左右 32px の内側余白を Library が確保している。外部 padding
      を追加する必要なし。
