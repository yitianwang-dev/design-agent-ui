# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _guidance_to_agent: |
    Dialog import 後、Title + 3 行 summary + description + 2 button は全部
    内部 render。spec で「金額確認」「購入 CTA」「Cancel button」等が言及
    されても、本 dialog 1 instance を import するだけで全部 visible。
  _recommended_pattern: |
    1) Language を spec から決定。
    2) variant.createInstance() → modal layer (z 順序最前)。
    3) Center on canvas: instance.x = (W - 270) / 2, y = (H - height) / 2。
    4) Values (2セット / 10枚 / ¥1,000) は Library default のまま prototype
       OK。実装時 app 側で user 選択 PkgCard データを bind。
  elements_rendered_internally:
    - "Container wrapper"
    - "dialogTitleText (チケットを購入しますか？ / Purchase tickets?)"
    - "purchaseSummarySection > 上下 Divider + 3 row (productRow / ticketCountRow / paymentAmountRow)"
    - "各 row: labelText + valueText (商品/枚数/金額 ⇔ Product/Tickets/Amount)"
    - "descriptionText (App Store / Google Play 決済導線)"
    - "Action > 2 Dialog/Button item (購入する/Buy primary + キャンセル/Cancel)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  spec_signal_to_variant:
    Language:
      "「日本語」「JP」 or default": JP
      "「English」「EN」": EN

  default_variant:
    Language: JP

  common_scenarios:
    "purchase_confirmation_overlay":
      description: |
        Shop/PkgCard tap → 確認 dialog 表示。背景は 50% opacity scrim 推奨、
        dialog は center 配置 (modal layer)。
      variant: { Language: JP }
      modal_overlay_recommended: true
    "en_purchase_confirmation":
      description: "EN viewer 同 (height -17px since description fits 1 line)"
      variant: { Language: EN }

  selection_examples:
    - spec: "Show purchase confirm dialog for 1000 ticket pack, JP"
      decision: { Language: JP }
      _note: "Default values (2セット / 10枚 / ¥1,000) match 1000 pack — no binding needed."
    - spec: "Same dialog for 500 pack EN"
      decision: { Language: EN }
      _note: "Values still default 1000 — binding/text override needed for 500 pack values (1セット / 5枚 / ¥500). Library forbids text override; consider variant request to Hori."

  related_components:
    - "Shop/PkgCard (schema 01) — 本 dialog の trigger"
    - "ticketSummarySection (schema 02) — 同 Shop 画面 header 直下、本 dialog より上に表示される現在残高"
    - "AppStore Dialog - Purchase-Success (Library reference-only) — 購入完了後の成功画面 (OS native)"

  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('465b4b670bacf789f4851fcaf39233025d61057f');
    const variant = set.children.find(v => v.variantProperties?.Language === 'JP')
      || set.defaultVariant;
    const instance = variant.createInstance();
    // Center as modal — typical 402×874 canvas:
    instance.x = (402 - 270) / 2;  // = 66
    instance.y = (874 - instance.height) / 2;  // center vertically
    // Add semi-transparent scrim background separately if rendering as overlay.

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: MUST
    rule: |
      Library 注記「インスタンス上での文言変更禁止」— productRow_valueText /
      ticketCountRow_valueText / paymentAmountRow_valueText を override しない。
      Library default は 1000 pack。他 pack で表示する場合は app 側 binding
      (componentProperties / live data) で処理、Figma static prototype では
      1000 pack の値で代表させる。
  - severity: MUST
    rule: |
      Modal として overlay 配置時、背景に scrim (rgba(0,0,0,0.5) 等) frame を
      別途追加。本 dialog 自体は scrim を含まない。
  - severity: SHOULD
    rule: |
      JP と EN で container 高さが違う (328 vs 311)。auto-layout 親に置く時
      は注意、絶対配置で center するなら instance.height を読んで動的に y
      計算。
  - severity: NICE
    rule: |
      Primary CTA「購入する」は Dialog/Button item の variant 自動で
      強調表示 (typically Apple-style blue bold)。Cancel は通常 weight。
      手動 color/weight override 不要。
