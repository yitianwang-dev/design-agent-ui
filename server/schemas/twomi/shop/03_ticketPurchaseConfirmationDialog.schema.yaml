# ============================================================
# Schema PJ — ticketPurchaseConfirmationDialog (single-component-set)
# ============================================================
# Generated: 2026-06-04
#
# チケット購入確認ダイアログ。Shop/PkgCard 選択 → 本 dialog で
# 「商品・枚数・金額」確認 → 「購入する」で App Store / Google Play
# 決済画面に遷移、「キャンセル」で戻る。
#
# Library defaults: 1000 pack (2セット / チケット10枚 / ¥1,000)。
# 実装時は user 選択した PkgCard に応じて 3 つの valueText を dynamic
# binding (Figma instance override は禁止)。
#
# Runtime requirements: v0.5+ with variants.combinations
# ============================================================

meta:
  name: ticketPurchaseConfirmationDialog
  library_source:
    file_key: CPe64VQc7petbZawTE6J8o
    component_set_node_id: "465b4b670bacf789f4851fcaf39233025d61057f"
  library_description_raw: |
    【用途 / Usage】
    チケット購入確認ダイアログ。
    Ticket purchase confirmation dialog.
    【使用画面 / Used in】
    チケット購入画面 / Ticket purchase screen
    【State】
    Language: JP / EN
    【注意 / Notes】
    インスタンス上での文言変更禁止。Do not edit text on instances.
  description: |
    Modal dialog 270×W (JP 328 / EN 311 — EN description が 1 行なので 17px
    短い)。 Title + 3 行 summary row (productRow / ticketCountRow /
    paymentAmountRow) + 決済導線 description + 2 button (購入する/キャンセル
    縦並び)。Master §4.3 dialog 使い分け原則: 課金は重大決定 = dialog で stop。
  screen_usage:
    - "チケット購入画面 (Shop) — PkgCard tap → 本 dialog 表示"
    - "Live 視聴中 SendTicketTippingBottomSheet NotEnoughTickets → 「購入する」CTA → Shop → PkgCard tap → 本 dialog"
  dependencies:
    - "Dialog/Button item — primary CTA + Cancel の 2 button instance"
  runtime_version: v0.5
  coverage:
    total_variants:
      "ticketPurchaseConfirmationDialog": 2
    implemented: full
    notes: |
      2 variants (Language JP / EN) のみ。
      JP 270×328 / EN 270×311 (EN description 1 行のため -17px)。
      Boolean / Pack-size property なし → 全 pack 共通 dialog、values
      は app 側 dynamic binding（Library text override 禁止）。
  review_status: ai-draft

