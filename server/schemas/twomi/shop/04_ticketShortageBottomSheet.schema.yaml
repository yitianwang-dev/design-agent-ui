# ============================================================
# Schema PJ — ticketShortageBottomSheet (single-component-set)
# ============================================================
# Generated: 2026-06-04
#
# チケット不足時に表示するボトムシート。Tier 限定 content (例: ExclusiveContent
# Unlock) を視聴しようとした時、残高が足りない場合に表示。
# 「このティアN を解放するには あと N 枚必要です」の文言で Shop への CTA。
#
# vs sendTicketTippingBottomSheet (schema 26 LiveShow) State=NotEnoughTickets:
# - 26 schema: Live 視聴 tipping 中の不足 → 「購入する」CTA → Shop
# - 本 schema: Tier 限定 content unlock 試み時の不足 → 「ショップへ」CTA → Shop
#   こっちは Tier N + 不足枚数 N の dynamic 表示で、より content-aware なメッセージ
#
# Runtime requirements: v0.5+ with variants.combinations
# ============================================================

meta:
  name: ticketShortageBottomSheet
  library_source:
    file_key: CPe64VQc7petbZawTE6J8o
    component_set_node_id: "6f78ef826b4a33f8f1237b24ce8bebc0be318a45"
  library_description_raw: |
    【用途 / Usage】
    チケット不足時に表示するボトムシート。
    Bottom sheet shown when tickets are insufficient.
    【使用画面 / Used in】
    チケット購入が必要な操作時 / When ticket purchase is required
    【State】
    Language: JP / EN
    【注意 / Notes】
    インスタンス上での文言変更禁止。Do not edit text on instances.
  description: |
    Bottom sheet 402×W (JP 333 / EN 330)。Handle + Header (Title 「チケットが
    足りません」 + Close Circle) + Contents (Tier N 提示 + 内蔵
    ticketSummarySection (残高表示) + 「ショップへ」 CTA button) + Home Indicator
    の構造。Tier 番号 N と不足枚数 N は dynamic content (Library default は N=N
    placeholder のまま、app 側 binding 必要)。
  screen_usage:
    - "Tier 限定 content (ExclusiveContent Unlock) 視聴試み時、残高不足 → 本 sheet"
    - "AvatarCard Use Case=ExclusiveContentLock tap → 本 sheet (購入 prompt + 自分の残高表示 + Shop 遷移)"
    - "vs Live tipping insufficient → sendTicketTippingBottomSheet (LiveShow schema 26) NotEnoughTickets variant 使う、用途違うので混同注意"
  dependencies:
    - "Outline / Essentional, UI / Close Circle (内部 close icon)"
    - "ticketSummarySection 構造 (Library 内蔵、schema 02 と同形だが instance ではなく内部複製)"
    - "Ticker Bold (内部 icon for balance)"
    - "Button instance (Ghost Smile icons + 「ショップへ」/「Go to Shop」text)"
  runtime_version: v0.5
  coverage:
    total_variants:
      "ticketShortageBottomSheet": 2
    implemented: full
    notes: |
      2 variants (Language JP / EN) のみ。
      JP 402×333 / EN 402×330 (EN tier message が 2 行で揃うので 3px 短い)。
      内部の Tier 番号 N と 不足枚数 N は Library default の placeholder、app
      で dynamic 置換必要 (Figma instance での text override は禁止)。
  review_status: ai-draft

components:
  - id: ticketShortageBottomSheet
    source:
      library_file_key: CPe64VQc7petbZawTE6J8o
      component_set_node_id: "6f78ef826b4a33f8f1237b24ce8bebc0be318a45"

    variants:
      combinations:
        - { Language: JP }
        - { Language: EN }

    container:
      node_type: COMPONENT
      name_template: "Language=${Language}"
      size:
        by_variant:
          - { when: { Language: JP }, value: { width: 402, height: 333 } }
          - { when: { Language: EN }, value: { width: 402, height: 330 } }

    children:

      - id: Handle
        node_type: RECTANGLE
        name: Handle
        size: { width: 48, height: 6 }
        position: { x: 177, y: 3.76 }
        description: "Drag indicator (上部 grab handle)"

      - id: Header
        node_type: FRAME
        name: Header
        size: { width: 402, height: 24 }
        position: { x: 0, y: 24 }
        children:
          - id: Header_Title
            node_type: TEXT
            font_size: 17
            characters:
              by_variant:
                - { when: { Language: JP }, value: "チケットが足りません" }
                - { when: { Language: EN }, value: "Not enough tickets" }
          - id: CloseCircle
            node_type: INSTANCE
            name: "Outline / Essentional, UI / Close Circle"
            size: { width: 24, height: 24 }
            position: { x: 362, y: 0 }

      - id: Contents
        node_type: FRAME
        name: Contents
        size_by_variant:
          - { when: { Language: JP }, value: { width: 402, height: 227 } }
          - { when: { Language: EN }, value: { width: 402, height: 224 } }
        position: { x: 0, y: 60 }
        children:

          - id: header_message
            node_type: FRAME
            name: header
            size_by_variant:
              - { when: { Language: JP }, value: { width: 370, height: 48 } }
              - { when: { Language: EN }, value: { width: 370, height: 45 } }
            position: { x: 16, y: 16 }
            children:
              - id: tier_message_Title
                node_type: TEXT
                _note: |
                  Tier 番号 N と不足枚数 N は dynamic placeholder。
                  実装時は app 側で binding (e.g. Tier 2 / あと 5 枚)。
                  Library default = ティアN / Tier N、あと 1 枚 / 1 more ticket。
                characters:
                  by_variant:
                    - { when: { Language: JP }, value: "このティアN を解放するには あと 1 枚必要です" }
                    - { when: { Language: EN }, value: "You need 1 more ticket \nto unlock Tier N." }

          - id: ticketSummarySection
            node_type: FRAME
            name: ticketSummarySection
            size: { width: 370, height: 80 }
            position_by_variant:
              - { when: { Language: JP }, value: { x: 16, y: 80 } }
              - { when: { Language: EN }, value: { x: 16, y: 77 } }
            description: |
              ⚠️ Library 内蔵 (instance ではなく、ticketSummarySection schema 02
              と同形の structure を本 sheet 内部に複製してある)。修正/置換は
              本 sheet を override するしかなく、schema 02 instance を sibling
              として追加してはいけない（二重表示）。
            children:
              - id: Frame_1
                node_type: FRAME
                size: { width: 338, height: 48 }
                position: { x: 16, y: 16 }
                children:
                  - id: balance_labelText
                    node_type: TEXT
                    font_size: 13
                    position: { x: 8, y: 17.5 }
                    characters:
                      by_variant:
                        - { when: { Language: JP }, value: "所有チケット" }
                        - { when: { Language: EN }, value: "Tickets owned:" }
                  - id: ticketCount
                    node_type: FRAME
                    size_by_variant:
                      - { when: { Language: JP }, value: { width: 50, height: 32 } }
                      - { when: { Language: EN }, value: { width: 87, height: 32 } }
                    position_by_variant:
                      - { when: { Language: JP }, value: { x: 280, y: 8 } }
                      - { when: { Language: EN }, value: { x: 243, y: 8 } }
                    children:
                      - id: Icon
                        node_type: FRAME
                        size: { width: 18, height: 18 }
                        position: { x: 0, y: 7 }
                        children:
                          - id: Ticker_Bold
                            node_type: INSTANCE
                            name: "Ticker Bold"
                            size: { width: 18, height: 18 }
                      - id: countText
                        node_type: TEXT
                        font_size: 15
                        position: { x: 26, y: 8.5 }
