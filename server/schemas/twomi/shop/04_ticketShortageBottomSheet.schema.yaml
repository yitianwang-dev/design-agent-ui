                        characters:
                          by_variant:
                            - { when: { Language: JP }, value: "3枚" }
                            - { when: { Language: EN }, value: "3 tickets" }

          - id: Button_Wrapper
            node_type: FRAME
            name: "Button Wrapper"
            size: { width: 370, height: 51 }
            position_by_variant:
              - { when: { Language: JP }, value: { x: 16, y: 176 } }
              - { when: { Language: EN }, value: { x: 16, y: 173 } }
            children:
              - id: cta_button
                node_type: INSTANCE
                name: Button
                size: { width: 370, height: 51 }
                font_size: 16
                description: |
                  Primary CTA: 「ショップへ」/「Go to Shop」。Button instance に
                  Ghost Smile decorative icons が 2 つ (左右) 既に含まれている。
                  外部から icon を追加しないこと。
                characters:
                  by_variant:
                    - { when: { Language: JP }, value: "ショップへ" }
                    - { when: { Language: EN }, value: "Go to Shop" }

      - id: Home_Indicator
        node_type: FRAME
        name: "Home Indicator"
        size: { width: 402, height: 34 }
        position_by_variant:
          - { when: { Language: JP }, value: { x: 0, y: 299 } }
          - { when: { Language: EN }, value: { x: 0, y: 296 } }
        description: "iOS Home Indicator (Bottom Safe Area)"
        children:
          - id: home_bar
            node_type: RECTANGLE
            size: { width: 148, height: 5 }
            position: { x: 275, y: 21 }

# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _guidance_to_agent: |
    Sheet import 後、Handle + Header (Title + Close) + Contents (Tier 提示 +
    内蔵 ticketSummarySection + Goto Shop button) + Home Indicator は全部
    内部 render。spec で「不足残高表示」「Shop button」「Close button」等が
    言及されても、本 sheet 1 instance を import するだけで全部 visible。
  _critical_no_double_summary: |
    ⚠️ ticketSummarySection は本 sheet 内部に複製版が含まれている。schema 02
    の ticketSummarySection instance を本 sheet の sibling として追加すると
    残高表示が二重に出る (典型 bug)。本 sheet を使う screen では schema 02
    を別途追加しない。
  _recommended_pattern: |
    1) Language を spec から決定。
    2) variant.createInstance() → bottom-anchored modal (y=541 for 874 canvas,
       sheet height 333 → bottom at 874)。
    3) Tier 番号 N / 不足枚数 N は Library default のまま prototype OK、
       実装時 app 側 dynamic binding。
    4) 背景に scrim (rgba(0,0,0,0.5)) frame を別途追加 (sheet 自体は scrim
       を含まない)。
  elements_rendered_internally:
    - "Handle (drag indicator 48×6)"
    - "Header: Title (チケットが足りません / Not enough tickets) + Close Circle"
    - "Contents > header_message: tier 解放案内 Title (ティアN, 不足N 枚 placeholder)"
    - "Contents > ticketSummarySection (内蔵: 所有チケット + Ticker icon + count)"
    - "Contents > Button Wrapper > Button (ショップへ / Go to Shop, Ghost Smile icons 含む)"
    - "Home Indicator (iOS 下部 Safe Area handle)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  spec_signal_to_variant:
    Language:
      "「日本語」「JP」 or default": JP
      "「English」「EN」": EN

  default_variant:
    Language: JP

  trigger_context:
    description: |
      本 sheet は **Tier 限定 content unlock 試み時**の不足表示。Live tipping
      中の不足 (sendTicketTippingBottomSheet NotEnoughTickets variant) とは
      用途分離。spec の文脈を読んで適切な component を選ぶ:
    rules:
      - if: "spec が「Tier」「ExclusiveContent」「Unlock」「限定 content」等を含む"
        → "use ticketShortageBottomSheet (本 schema)"
      - if: "spec が「Live 配信中」「tipping」「投げ銭」中の不足"
        → "use sendTicketTippingBottomSheet (LiveShow schema 26) State=NotEnoughTickets"

  common_scenarios:
    "exclusive_content_unlock_insufficient":
      description: |
        Other 画面で ExclusiveContentLock state の avatar / content tap →
        Tier 2 unlock 要求 → 残高不足 → 本 sheet 表示。
      variant: { Language: JP }
      position: { x: 0, y: 541 }
      modal_overlay_recommended: true
    "en_tier_unlock_insufficient":
      description: "EN viewer 同 (height -3px since tier message wraps 1 line)"
      variant: { Language: EN }
      position: { x: 0, y: 544 }

  selection_examples:
    - spec: "Show insufficient ticket sheet for Tier 2 unlock, JP"
      decision: { Language: JP }
      _note: "Library default 値で十分 (Tier N / 1枚 placeholder)。実装時 Tier 2 / 不足枚数の dynamic binding。"
    - spec: "EN locale Tier 1 unlock insufficient"
      decision: { Language: EN }

  related_components:
    - "ticketSummarySection (schema 02) — DO NOT add separately, 本 sheet 内部に複製済み"
    - "Shop/PkgCard (schema 01) — 本 sheet の「ショップへ」CTA からの遷移先"
    - "ticketPurchaseConfirmationDialog (schema 03) — Shop → PkgCard tap → confirm dialog"
    - "sendTicketTippingBottomSheet (LiveShow schema 26) NotEnoughTickets variant — Live tipping 不足、文脈で使い分け"
    - "ExclusiveContent-FAN / AvatarCard ExclusiveContentLock — 本 sheet を trigger する content"

  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('6f78ef826b4a33f8f1237b24ce8bebc0be318a45');
    const variant = set.children.find(v => v.variantProperties?.Language === 'JP')
      || set.defaultVariant;
    const instance = variant.createInstance();
    // Bottom-anchored modal — typical 402×874 canvas:
    instance.x = 0;
    instance.y = 874 - instance.height;  // sticks to bottom
    // Add semi-transparent scrim background separately if rendering as overlay.

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: MUST
    rule: |
      Library 注記「インスタンス上での文言変更禁止」— tier_message_Title /
      countText / Header_Title 等の文言を override しない。Tier N / N枚 の
      dynamic 値は app 側 binding (componentProperties / live data)、Figma 上
      は default placeholder のまま。
  - severity: MUST
    rule: |
      ⚠️ ticketSummarySection は本 sheet 内部に複製済み。schema 02 の instance
      を本 sheet と同じ screen に sibling として追加禁止 — 残高表示が二重に
      出る (二重表示 bug、§1.9 G)。
  - severity: MUST
    rule: |
      本 sheet と LiveShow schema 26 sendTicketTippingBottomSheet
      NotEnoughTickets variant を混同しない。
      - 本 sheet: Tier 限定 content unlock 文脈、CTA「ショップへ」
      - schema 26: Live tipping 中文脈、CTA「購入する」(Buy Tickets)
      Spec の文脈 keyword で判別。
  - severity: SHOULD
    rule: |
      Modal として overlay 配置時、背景に scrim (rgba(0,0,0,0.5)) frame を
      別途追加。本 sheet 自体は scrim を含まない。
  - severity: SHOULD
    rule: |
      Bottom-anchored 配置時、Home Indicator (h=34, iOS Safe Area) が sheet
      下端に含まれている。Canvas h=874 → instance.y = 541 (JP) / 544 (EN)。
  - severity: NICE
    rule: |
      JP と EN で container 高さが違う (333 vs 330)。auto-layout 親に置く時
      は注意。
