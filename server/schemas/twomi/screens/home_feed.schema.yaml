# ============================================================
# home_feed.schema.yaml — Screen-level schema
# ============================================================
# Home Feed 画面（フルスクリーン縦スワイプ、Avatar Card 中心）
# Self / Other-following / Other-follow をすべてカバー。
# ============================================================

meta:
  name: Home / Feed
  description: |
    フルスクリーン Avatar フィード画面。縦スワイプでページング（連続スクロール
    ではない、TikTok 形式）。各ページは 1 つの Avatar Card で、画面いっぱいに
    アバター動画 / Live 配信が表示される。BottomNav は Float。
    Self（自分が見るフィード）と Other（他人のフィード）は User variant で統合。
  scaffold: B
  scaffold_reason: |
    フルスクリーン + BottomNav Float。Header は overlay、コンテンツは
    画面全体を使う。
  source_analysis: server/rules/twomi_screen_analysis.md §2
  # PR #25 (2026-06-02): Hori 作成の 5 Pattern snapshot を正式参照
  source_snapshot: server/rules/snapshots/home_feed_patterns_20260602.md
  source_figma: "Sandbox-Profile-test_20260601 / node-id: 53022-20455"
  applies_when_screen_name_contains:
    - home_feed
    - homeFeed
    - homefeed
    - home / feed
    - feed_other_following
    - feed_other_follow
  screen_size: { width: 402, height: 874 }
  background: "#000000"

scaffold_setup:
  type: B
  selected_nav_tab: Home

variants:
  user:
    values: [self, otherFollowing, otherFollow]
    note: |
      自分 / フォロー中の他人 / 未フォロー他人で右上 CTA が変わる。
  avatarStatus:
    values: [publicGenerating, placeholder, MemberLock, MemberUnlock]
  hasAudio:
    values: [true, false]
  exclusiveContent:
    values: [false, true]
  viewStatus:
    values: [true, false]
  tag:
    values: [true, false]

# ============================================================
# 5 Pattern 定義（PR #25, Hori snapshot 2026-06-02 同期）
# ============================================================
# Home Feed は 5 つの異なる Pattern を縦に積み上げる。各 Pattern は
# 異なるレイヤー構造を持つ。spec の文脈から Pattern を判定する。
# 詳細レイヤー tree は source_snapshot を参照。
patterns:
  - id: self_normal
    name: Avatar Card / Self Normal
    when: ログインユーザー自身の Avatar をフィードに表示
    structure_summary: |
      Avatar image（フルスクリーン背景）+ Sound toggle（左上）+
      LiveBadge（右上、条件表示）+ information（下詰め bottom:132px）
      information 内: Avatar Profile Header（ExclusiveContentBadge +
      MainSection [Name + buttonCall] + ActionEngagement [Bookmark + Share]）
      + creator-name-follow（type: Self Home）
    variant_mapping:
      user: self
      exclusiveContent: false
    creator_name_follow_type: "Self Home"

  - id: other_normal
    name: Avatar Card / Other Normal
    when: 他ユーザーの Avatar をフィードに表示
    structure_summary: |
      Self Normal と同構造。creator-name-follow の type のみ変更。
      followSettings（Follow / Following button）が追加される。
    variant_mapping:
      user: otherFollowing or otherFollow
      exclusiveContent: false
    creator_name_follow_type: "other"
    design_principle: |
      Self と Other で画面を分けない。同じ構造・異なる権限。
      Self は編集者、Other は観客。

  - id: r1_carousel
    name: Exclusive Content Avatar / R1 CarouselContainer
    when: Creator が限定コンテンツ運営中 かつ 閲覧者未購入（Promotion 手法 1）
    structure_summary: |
      AvatarCard（w:402 Pattern 2 と同構造）+ FeedCarousel_Rail（w:402、
      横スワイプで表示）が横に並ぶ。両方に AvatarCardIndicatorSection が
      bottom:107px に置かれる。Rail 内に EdgeRecommendationCard
      （Background blur:25px + R1PromotionMessage + PR-StackingCards_Video）。
    variant_mapping:
      user: otherFollowing or otherFollow
      exclusiveContent: true
      viewStatus: true  # 横スワイプ可能な R1
    layout_note: |
      縦スクロール（Creator 間移動）と横スワイプ（Promotion 表示）で
      動線を分離する。snap scroll で 1 枚単位切替。
    indicator_position: { bottom: 107 }

  - id: livestream
    name: HomeFeed LiveStream
    when: Live 配信中の Avatar をフィードに表示
    structure_summary: |
      他 Pattern と異なり Title が上部、情報順序が「何か（配信内容）→
      誰か（Creator）」。Background = NeonBar 画像（ステージ連動）。
      Container（pt:102px px:26px）に Title + Cast（Host 左半分 + Guest
      右半分 h:244px）。StreamInformation（top:596px px:20px）。
      CreatorInformation（bottom:132px）。Sound toggle（left:20px top:192px）。
    variant_mapping:
      avatarStatus: liveStreaming  # spec で live を言及した場合
    design_principle: |
      Host + Guest 2 分割は配信の性質（対談・会話）を画面構造に反映。
      背景はステージ選択と連動し「設定を体験にする」設計哲学の実践。

  - id: r2_blur_card
    name: R2 AvatarBlurCard
    when: Creator が限定コンテンツ運営中 かつ 閲覧者未購入（Promotion 手法 2）
    structure_summary: |
      Avatar image に blur:5px + Exclude マスク（mix-blend-multiply）で
      Locked 状態を表現。ExclusiveContentInformation（bottom:132px）+
      R2PromotionMessage（bottom:208px 中央：UserNameIcon + LockText +
      ctaButton h:55px 半透明）。
    variant_mapping:
      user: otherFollowing or otherFollow
      exclusiveContent: true
      viewStatus: false  # blur 表示
    design_principle: |
      「存在するが見えない」状態を blur + Exclude マスクで表現。
      唯一のアクションが CTA のため中央配置。
    cta_button:
      height: 55
      note: ルール策定前の既存値を踏襲

# ============================================================
# 全 Pattern 共通の spacing 仕様（PR #25, Hori snapshot 2026-06-02）
# ============================================================
# これらは Master §2.8 Spacing token の例外ではない場所もあるが、
# Hori snapshot が明示した値を踏襲する。
pattern_spacing:
  information_position:
    bottom: 132  # 全 Pattern 共通：BottomNav 102 + 余白 30
    px: 20       # 全 Pattern 共通：optical 値（token 外）
    reason: |
      主役は Avatar の顔。情報を上に置くと顔に被る。下詰めにすることで
      Avatar を邪魔しない。親指の操作範囲（画面下部）とも一致。
  action_engagement_gap: 24  # タップ領域確保のため意図的に広め
  shadow:
    top: 492
    height: 382
  r1_indicator_bottom: 107
  r2_promotion_bottom: 208

# Avatar Card は Library にある複雑な ComponentSet。
# 詳細な variant は Library 側で定義済み。spec の文脈から適切な
# variant を選択する。
required_components:
  - name: Avatar Card
    note: |
      Home Feed の主体。各ページに 1 つ、画面全体に表示。
      Library から import + createInstance、variant は spec の文脈に
      応じて選択（Model / Status / User / UseCase 等）。
  - name: User icon
    library_component_key: "51faaa59eccc1fd112e9f7c88100c2077004e974"
    note: |
      右上の自分のアイコン + Avatar Card 内の投稿者アイコン（必要時）。

forbidden_components:
  - name: Avatar infomation
    reason: |
      Avatar Card で十分。Avatar 詳細 widget を上に重ねない。
  - name: 画面下部 BottomNav の自前作成
    reason: |
      scaffold B が NavigationLiquid（DarkMode=Dark）を自動追加。
      contentFrame に BottomNav を入れない。

content_structure:
  layout: VERTICAL
  # フルスクリーン B では padding なし
  padding: { top: 0, right: 0, bottom: 0, left: 0 }
  spacing: 0

  sections:
    # ─ Section 1: avatarCardPage（必須・全画面）─
    - id: avatarCardPage
      description: |
        Avatar Card 1 枚を画面全体に配置。Background は Card 自身が持つ
        （avatar 動画 / Live 映像）。
      required: true
      layout: ABSOLUTE  # フルスクリーン配置のため
      children:
        - role: avatarCard
          kind: INSTANCE
          component_ref: Avatar Card
          variant_selection:
            # spec の文脈から動的決定。デフォルト:
            Model: selfVideo  # spec が "live streaming" を含むなら selfInCallVideo
            User: self        # spec の user 視点に応じて
            Status: publicGenerating
            ViewStatus: false
            Tag: false
            ExclusiveContent: false
          size: { width: 402, height: 874 }
          position: { x: 0, y: 0 }

    # ─ Section 2: topRightAction（任意・右上 CTA）─
    - id: topRightAction
      description: |
        Header 領域内（y=0〜60、SafeArea Top 内）の右側に小さな action。
        Self → notification icon、Other-following → following badge、
        Other-follow → "+ フォロー" button。
      required: false
      conditional: spec が右上 CTA を言及した場合
      layout: ABSOLUTE
      position: { x: 350, y: 60 }
      note: |
        scaffold の Header は overlay。topRightAction も Header と同じ層。

    # ─ Section 3: avatarOverlay（Avatar Card 内オーバーレイ）─
    - id: avatarOverlay
      description: |
        Avatar Card の右側に縦並びアクション（like / comment / share 等）と
        左下に投稿者情報（User icon + 名前 + tag）。
      required: false
      conditional: |
        Avatar Card 内に既に含まれている場合は不要。spec が明示的に
        追加要素を要求した場合のみ追加。
      note: |
        Avatar Card 自体が overlay を含む variant を持つ。spec の指示と
        Card の variant を確認し、二重表示を避ける。

design_principles:
  - id: fullscreen_no_padding
    rule: |
      Home Feed はフルスクリーン。padding 0、avatar 動画が画面端まで届く。
  - id: dark_background
    rule: |
      背景 #000000。BottomNav は DarkMode=Dark を選ぶ（scaffold B のデフォルト）。
  - id: page_per_swipe
    rule: |
      連続スクロールではなく 1 ページ = 1 Avatar Card。生成時は 1 ページのみ
      実装する（プレビュー用）。複数ページの実装は Prototype で連携。
  - id: tap_to_hide_ui
    rule: |
      Avatar Card 上をタップすると UI が消える（UseCase: Home Pre-trans variant）。
      生成時は通常状態のみ実装。
  - id: dynamic_bg_gradient
    rule: |
      Avatar Card の背景グラデーションは avatar 画像の代表色から動的生成
      （固定値ではない）。spec で色を指定された場合のみ override。

known_failure_modes:
  - id: missing_avatar_card
    case: AI が Avatar Card を import せず空白フィードを生成
    fix: |
      required_components の Avatar Card を必ず import + createInstance。
      Library に existing variant が複数あるので、spec から最適 variant を選ぶ。
  - id: duplicate_bottom_nav
    case: scaffold B が BottomNav を追加するのに contentFrame にも追加
    fix: |
      forbidden の通り、contentFrame に NavigationLiquid を絶対追加しない。
  - id: avatar_card_wrong_size
    case: Avatar Card を 402×874 以外のサイズで配置
    fix: |
      必ず 402×874 全画面。Header overlay を考慮して y=0 から開始。
  - id: white_background_misuse
    case: Type A の白背景設定で生成
    fix: |
      Home Feed は scaffold B、黒背景固定。

self_check:
  - Avatar Card を Library から import したか？
  - Avatar Card のサイズは 402×874 か？
  - 背景は黒 #000000 か？
  - scaffold B のみ使用したか（A や C ではない）？
  - contentFrame に Header / BottomNav / NavigationLiquid を追加していないか？
  - 縦並びアクションは Avatar Card variant に内包されているか（二重表示してない）？
  - Avatar Card variant 選択が spec の文脈に合っているか？
