meta:
  name: SingleLiveViewerHeader
  library_source:
    file_key: CPe64VQc7petbZawTE6J8o
    component_set_node_id: "1b3fd0fd6140dc4e89301bdb222273ca7f456bf6"
  library_description_raw: |
    【用途 / Usage】
    Live視聴画面のヘッダー。Exclusive Content・Option MenuをBooleanで表示切り替え。
    Header on Live viewer screen.
    【使用画面 / Used in】
    Live視聴画面（Viewer） / Live viewer screen
    【State】
    State: Default
  description: |
    Live 視聴画面 (Viewer) の上部 header。LiveBadge + ExclusiveContentBadge
    + Creator info (icon + name + follow) + Tool buttons (Close + Menu) を
    1 つの component に統合。
  screen_usage:
    - "Live 視聴画面 (Viewer)"
  dependencies:
    - "LiveBadge (schema 11, nested instance — State=LIve default)"
    - "exclusiveContentBadge (inner instance — UnlockIcon + UnlockText '解放中')"
    - "creator-name-follow (inner instance — type=LiveViewer)"
    - "LivefollowSettings (inner follow button)"
    - "SideTool - ExitButton (Close × button)"
    - "SideTool - OptionMenuButton (Menu Dots button)"
  runtime_version: v0.5
  coverage:
    total_variants:
      "SingleLiveViewerHeader": 1
    implemented: full
    notes: |
      1 variant only (State=Default)。Exclusive Content / Option Menu の
      Boolean toggle が将来追加される可能性あり (description 注記)。
  review_status: ai-draft

