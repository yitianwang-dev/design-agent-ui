# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _warning: |
    SingleLiveViewerHeader は LiveBadge + exclusiveContentBadge +
    creator-name-follow + Tool buttons を内包。これら全部 instance 内部で
    レンダリングされる。外側に複製禁止。
  elements_rendered_internally:
    - "LiveBadge (nested, LIve + Watcher count)"
    - "exclusiveContentBadge (UnlockIcon + '解放中' text)"
    - "creator-name-follow (User icon + name + follow button)"
    - "SideTool - ExitButton (close × icon)"
    - "SideTool - OptionMenuButton (menu dots icon)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  no_state_variant_yet: |
    現状 State=Default のみ。description 注記「Exclusive Content・Option
    Menu を Boolean で表示切り替え」とあるが、現時点では variant に
    実装されていない。
  default_variant:
    State: Default
  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('1b3fd0fd6140dc4e89301bdb222273ca7f456bf6');
    const variant = set.children.find(v => v.variantProperties?.State === 'Default') || set.defaultVariant;
    const instance = variant.createInstance();

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: SHOULD
    rule: |
      Library description「Exclusive Content・Option Menu を Boolean で
      表示切り替え」と書かれているが、現時点で variant property に
      Boolean が無い。将来追加される可能性あり、定期 re-inspect 推奨。
  - severity: SHOULD
    rule: |
      Information frame の displayed width が 1 (auto-layout HUG、内部
      children で実 width 確定)。親 frame で width を固定しない。
  - severity: NICE
    rule: |
      Sub text "ハッシュタグ" が Tool button 内に隠れて存在する (sample data)。
      実際の visible text は Icon のみ。
