  library_description_raw: |
    【用途 / Usage】
    Smallギフト画像。
    Small gift image.
    【State】
    Size: Origin / H52
  description: |
    Small ギフト画像 component。Live tipping (low-tier) で使用。
    Gift tier シリーズの最小サイズ。Size で Origin / H52 を切替。
    Small gift image — low-tier tipping showcase.
  screen_usage:
    - "Live 視聴画面 — small tipping animation (5 tickets 等の low-tier)"
    - "Send TicketTipping Bottom Sheet — small option preview"
