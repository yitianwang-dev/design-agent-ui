# ─── Library internal elements (do not duplicate externally) ─
library_internal_elements:
  _warning: |
    Image Gift + GiftText + GiftPrice は instance 内部レンダリング。
    DO NOT add external image / gift label。
  elements_rendered_internally:
    - "Image frame > Image Gift instance (Small/Medium/Big 自動切替)"
    - "GiftInformation > GiftText (ギフト/スペシャル/プレミアム)"
    - "GiftInformation > GiftPrice (1枚/5枚/20枚)"

# ─── Agent usage hint ────────────────────────────────────────
agent_usage_hint:
  spec_signal_to_variant:
    Type:
      "「Small」「low tier」「1 ticket」": Small
      "「Medium」「mid tier」「5 tickets」「special」": Medium
      "「Large」「high tier」「20 tickets」「premium」": Large
    State:
      "「default」 or default": Default
      "「selected」「highlighted」": Selected
      "「insufficient」「greyed out」「not enough」": Insufficient
    Language:
      "「日本語」「JP」 or default": JP
      "「English」「EN」": EN
  default_variant:
    Language: JP
    Type: Medium
    State: Default

  ⚠️_use_main_instead: |
    本 BK_ component は legacy / backup。新規 spec では schema 25
    (TicketTippingButton, key 66b1593f...) を優先使用。
    本 BK は historical reference / Hori が削除するまで残す。

  common_scenarios:
    "legacy_compatibility":
      description: "古い Figma frame で BK_ 使用中のもの維持用"
      variant: { Language: JP, Type: Medium, State: Default }

  safe_pattern: |
    const set = await figma.importComponentSetByKeyAsync('27c26ecbcb9662a310cb5a7f68e4c8efaf0042c9');
    const variant = set.children.find(v => {
      const p = v.variantProperties || {};
      return p.Language === 'JP' && p.Type === 'Medium' && p.State === 'Default';
    }) || set.defaultVariant;
    const instance = variant.createInstance();

# ─── Caveats ─────────────────────────────────────────────────
critical_caveats:
  - severity: MUST
    rule: |
      "BK_" prefix = backup / legacy / 削除候補。新規 spec では使わず
      schema 25 (TicketTippingButton 本体) を使う。Hori が削除した時に
      壊れない実装にすること。
  - severity: SHOULD
    rule: |
      BK は価格 1枚 / 5枚 / 20枚 (main は 5/10/20)。spec の tier 数と
      mismatch する可能性が高い、よく確認。
  - severity: NICE
    rule: |
      main TicketTippingButton は JP compact (53) + EN 大型 (112) と
      design 分岐するが、BK は全 variant 統一 (112)。BK の方が初期設計、
      main は後から JP compact 追加した可能性。
